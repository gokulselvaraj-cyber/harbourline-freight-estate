---
- name: TLS directory
  ansible.builtin.file:
    path: /etc/ssl/hf
    state: directory
    mode: "0750"
- name: Certificate
  ansible.builtin.copy:
    content: "{{ vault_tls_cert }}"
    dest: "/etc/ssl/hf/{{ tls_cert_name }}.crt"
- name: Key
  ansible.builtin.copy:
    content: "{{ vault_tls_key }}"
    dest: "/etc/ssl/hf/{{ tls_cert_name }}.key"
    mode: "0600"
  no_log: true
