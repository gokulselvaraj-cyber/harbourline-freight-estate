---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
- name: Allow ssh from ops subnet
  community.general.ufw:
    rule: allow
    port: "22"
    src: 10.40.20.0/24
- name: Allow service ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
  loop: "{{ open_ports | default([]) }}"
- name: Enable
  community.general.ufw:
    state: enabled
    policy: deny
