name: ansible
on:
  pull_request:
    paths: ["infra/ansible/**"]
  push:
    branches: [main]
    paths: ["infra/ansible/**"]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install ansible-lint==24.2.3
      - run: ansible-lint site.yml playbooks/
        working-directory: infra/ansible
