[project]
name = "harbourline-tracking-worker"
version = "1.9.1"
description = "Consumes dispatch and carrier events, keeps ETAs, notifies receivers"
requires-python = ">=3.11"
dependencies = [
  "pika==1.3.2",
  "psycopg[binary]==3.1.18",
  "httpx==0.27.0",
  "prometheus-client==0.20.0",
  "PyYAML==6.0.1",
]

[project.scripts]
hf-tracking-worker = "tracking_worker.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
