server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: booking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DB_USER:booking_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    virtual-host: /hf
    username: ${RABBIT_USER:hf_app}
    password: ${RABBIT_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
harbourline:
  rating:
    fuel-surcharge-pct: 12.5
    customs-docs-fee-gbp: 45.00
    road-volumetric-kg-per-m3: 333
  customs-docs:
    base-url: http://localhost:3000
    connect-timeout: 1s
    read-timeout: 4s
    max-retries: 2
    retry-backoff: 500ms
  events:
    exchange: hf.bookings
    confirmed-key: booking.confirmed.v1
    dispatched-key: booking.dispatched.v1
